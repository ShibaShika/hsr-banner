name: Auto Update HSR Banner Data

on:
  schedule:
    # 每日台灣時間 09:00 (UTC 01:00) 執行
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '僅執行抓取與檢驗，不提交 Push (Dry Run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  update-banner-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 下載專案程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安裝所需套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 執行全自動抓取與安全檢驗
        id: run_update
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python update_gist.py

      - name: 🔍 檢查是否有實質資料異動
        id: check_git
        run: |
          if [ -n "$(git status --porcelain js/characters.js js/patches.js)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "偵測到資料庫有實質更新！"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "目前資料庫已是最新狀態，無需提交。"
          fi

      - name: 💾 自動提交並推送更新 (Git Commit & Push)
        if: steps.check_git.outputs.has_changes == 'true' && !inputs.dry_run
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 讀取詳細變更摘要
          SUMMARY=""
          if [ -f .update_summary.md ]; then
            SUMMARY=$(cat .update_summary.md)
          fi
          
          TODAY=$(date -u +'%Y/%m/%d')
          COMMIT_MSG="🤖 Auto update banner data ($TODAY)

          $SUMMARY"
          
          git add js/characters.js js/patches.js
          git commit -m "$COMMIT_MSG"
          git push origin main
          echo "✅ 成功將最新卡池資料自動推送至 main 分支！"

      - name: 📋 輸出更新摘要至 Step Summary
        if: steps.check_git.outputs.has_changes == 'true'
        run: |
          echo "## 📊 HSR Banner 資料庫自動更新完成" >> $GITHUB_STEP_SUMMARY
          if [ -f .update_summary.md ]; then
            cat .update_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 🚨 更新或檢驗失敗時自動建立 GitHub Issue 警報
        if: failure() && steps.run_update.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const today = new Date().toISOString().slice(0, 10);
            const title = `[自動警報] HSR Banner 全自動更新或安全檢驗失敗 (${today})`;

            // 避免重複建立相同日期的 Issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-update-fail'
            });
            const alreadyExists = issues.data.some(i => i.title === title);
            if (alreadyExists) {
              console.log('今日失敗 Issue 已存在，跳過建立。');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: [
                '## ⚠️ 全自動更新或品質防護檢驗未通過',
                '',
                `- **觸發時間**：${new Date().toISOString()}`,
                `- **Run 紀錄**：[#${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                '### 🛡️ 安全防護機制提醒',
                '系統已觸發安全防護熔斷，**未對專案 main 分支進行任何更動**，保持線上網站不受影響。',
                '',
                '### 🔍 可能原因',
                '1. Fandom Wiki 或 StarRailRes 網路連線逾時。',
                '2. 未通過「五道安全防護檢驗門檻」（例如版本格式不符、歷史排程縮水或孤兒版本）。',
                '',
                '### 🛠️ 處理步驟',
                '1. 點擊上方 Run 連結檢查執行的具體日誌與錯誤門檻。',
                '2. 如需手動更新，亦可透過 `editor.html` 後台進行視覺化手動校驗。',
              ].join('\n'),
              labels: ['auto-update-fail']
            });
            console.log('已成功建立 GitHub Issue 警報。');
