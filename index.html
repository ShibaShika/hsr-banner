<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>崩壞：星穹鐵道 - 限定躍遷一覽表</title>

    <!-- 1. 載入全套視覺與樣式表 -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 2. 載入資料庫與配置文檔 -->
    <script src="js/patches.js"></script>
    <script src="js/paths.js"></script>
    <script src="js/elements.js"></script>
    <script src="js/characters.js"></script>
</head>
<body>

    <!-- 頂部工具列 (支援摺疊展開) -->
    <div class="header-bar">
        <div class="header-top-row">
            <h1>崩壞：星穹鐵道 - 限定躍遷一覽表</h1>
            <button type="button" id="toggle-toolbar-btn" class="toggle-toolbar-btn">
                <span>🔍 篩選與工具</span>
                <span id="toggle-arrow" class="arrow">▼</span>
            </button>
        </div>

        <div id="toolbar-panel" class="toolbar-panel">
            <div class="toolbar-inner">
                <div class="header-left">
                    <!-- 命途選單 -->
                    <div class="multi-select" id="path-dropdown">
                        <div class="select-box" id="path-select-box">命途</div>
                        <div class="dropdown-panel" id="path-panel">
                            <div id="path-items-container"></div>
                        </div>
                    </div>

                    <!-- 屬性選單 -->
                    <div class="multi-select" id="elem-dropdown">
                        <div class="select-box" id="elem-select-box">屬性</div>
                        <div class="dropdown-panel" id="elem-panel">
                            <div id="elem-items-container"></div>
                        </div>
                    </div>

                    <!-- 取得方法選單 -->
                    <div class="multi-select" id="type-dropdown">
                        <div class="select-box" id="type-select-box">取得方法</div>
                        <div class="dropdown-panel" id="type-panel">
                            <div id="type-items-container">
                                <label><input type="checkbox" class="type-item" value="normal"> 限定躍遷</label>
                                <label data-tooltip="加入非UP自選池"><input type="checkbox" class="type-item" value="pool"> 星緣相邀</label>
                                <label data-tooltip="加入兌換商店"><input type="checkbox" class="type-item" value="shop"> 聚靈鑄星</label>
                                <label><input type="checkbox" class="type-item" value="collab"> 長期聯動</label>
                            </div>
                        </div>
                    </div>

                    <!-- 礪爍新輝切換按鈕 -->
                    <button type="button" id="buff-toggle-btn" class="toggle-btn" data-tooltip="僅顯示加強過的角色">
                        <span class="toggle-icon">▲</span> 礪爍新輝
                    </button>

                    <!-- 搜尋框 -->
                    <input type="text" id="char-search-input" class="search-input" placeholder="搜尋角色">
                </div>

                <div class="header-right">
                    <div class="scale-wrap">
                        <span>介面大小：</span>
                        <input type="range" id="ui-scale-slider" min="0.7" max="1.4" step="0.05" value="1">
                        <span id="ui-scale-text">100%</span>
                    </div>
                    <!-- 更新日期 -->
                    <div class="update-date">更新日期：<span id="update-date-text">載入中...</span></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 表格主要容器 -->
    <div class="table-wrap">
        <table id="tracker"></table>
    </div>

    <!-- 3. 載入核心應用程式邏輯 -->
    <script src="js/app.js"></script>
</body>
</html>
