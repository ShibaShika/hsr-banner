<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="《崩壞：星穹鐵道》角色限定躍遷歷史與復刻等待期追蹤一覽表，支援多維度篩選、復刻超期警報、預覽排程與全尺寸圖片匯出。">
    <meta name="theme-color" content="#0b0e17">
    <meta property="og:title" content="崩壞：星穹鐵道 - 限定躍遷一覽表">
    <meta property="og:description" content="即時追蹤《崩壞：星穹鐵道》限定角色卡池歷史、目前未復刻等待期、歷史最長等待紀錄與未來預覽排程。">
    <meta property="og:type" content="website">
    <title>崩壞：星穹鐵道 - 限定躍遷一覽表</title>

    <!-- 1. 載入全套視覺與樣式表 -->
    <link rel="stylesheet" href="css/style.css">

    <!-- 2. 載入 html2canvas 圖片匯出函式庫 -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- 3. 載入資料庫與配置文檔 -->
    <script src="js/patches.js"></script>
    <script src="js/paths.js"></script>
    <script src="js/buffs.js"></script>
    <script src="js/elements.js"></script>
    <script src="js/characters.js"></script>
</head>
<body>

    <!-- 頂部工具列 (支援摺疊展開) -->
    <div class="header-bar">
        <div class="header-top-row">
            <h1>崩壞：星穹鐵道 - 限定躍遷一覽表</h1>
            
            <!-- 左右版本快速跳轉按鈕 (支援與版本順序動態連動) -->
            <div class="header-top-center-btns">
                <button type="button" id="jump-latest-btn" class="jump-btn" title="快速滾動至最左側小版本">◀ 最新</button>
                <button type="button" id="jump-oldest-btn" class="jump-btn" title="快速滾動至最右側小版本">最舊 ▶</button>
            </div>

            <div class="header-top-right-btns">
                <!-- 工具列摺疊切換按鈕 -->
                <button type="button" id="toggle-toolbar-btn" class="toggle-toolbar-btn">
                    <span>🔍 篩選與工具</span>
                    <span class="arrow">▼</span>
                </button>
            </div>
        </div>

        <div id="toolbar-panel" class="toolbar-panel">
            <div class="toolbar-inner">
                <div class="header-left">
                    <!-- 實裝版本選單 -->
                    <div class="multi-select" id="version-dropdown">
                        <div class="select-box" id="version-select-box">實裝版本</div>
                        <div class="dropdown-panel" id="version-panel">
                            <div id="version-items-container"></div>
                        </div>
                    </div>

                    <!-- 命途選單 -->
                    <div class="multi-select" id="path-dropdown">
                        <div class="select-box" id="path-select-box">命途</div>
                        <div class="dropdown-panel" id="path-panel">
                            <div id="path-items-container"></div>
                        </div>
                    </div>

                    <!-- 屬性選單 -->
                    <div class="multi-select" id="elem-dropdown">
                        <div class="select-box" id="elem-select-box">屬性</div>
                        <div class="dropdown-panel" id="elem-panel">
                            <div id="elem-items-container"></div>
                        </div>
                    </div>

                    <!-- 取得方法選單 -->
                    <div class="multi-select" id="type-dropdown">
                        <div class="select-box" id="type-select-box">取得方法</div>
                        <div class="dropdown-panel" id="type-panel">
                            <div id="type-items-container"></div>
                        </div>
                    </div>

                    <!-- 強化模式切換按鈕群組（依角色資料中出現過的強化模式動態生成；以下為首屏預設按鈕） -->
                    <div id="buff-mode-container" class="buff-mode-group" role="group" aria-label="強化模式篩選">
                        <button type="button" id="buff-toggle-btn" class="toggle-btn buff-mode-btn" data-buff-type="礪爍新輝" data-tooltip="僅顯示加強過的角色">
                            <span class="toggle-icon">▲</span> <span class="buff-mode-label">礪爍新輝</span>
                        </button>
                    </div>

                    <!-- 預覽版本切換按鈕 -->
                    <button type="button" id="preview-toggle-btn" class="toggle-btn" data-tooltip="切換顯示預覽版本">
                        <span class="toggle-icon">🔮</span> 預覽版本
                    </button>

                    <!-- 角色搜尋框 (含全平台相容內建 ✕ 按鈕) -->
                    <div class="search-wrap">
                        <input type="search" id="char-search-input" class="search-input" placeholder="搜尋角色">
                        <span id="search-clear-btn" class="search-clear-btn" style="display: none;">✕</span>
                    </div>

                    <!-- 一鍵清除篩選按鈕 (預設隱藏) -->
                    <button type="button" id="reset-filters-btn" class="reset-btn" style="display: none;">🧹 清除</button>
                </div>

                <div class="header-right">
                    <div class="scale-wrap">
                        <span>介面大小：</span>
                        <input type="range" id="ui-scale-slider" min="0.7" max="1.4" step="0.05" value="1">
                        <span id="ui-scale-text">100%</span>
                    </div>
                    <!-- 📷 匯出全尺寸圖片按鈕 -->
                    <button type="button" id="export-img-btn" class="export-btn" title="將當前完整的表格輸出為全尺寸 PNG 圖片">📷 截圖</button>
                    <!-- 更新日期 -->
                    <div class="update-date">更新日期：<span id="update-date-text">載入中...</span></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 表格主要容器 -->
    <div class="table-wrap">
        <table id="tracker"></table>
    </div>

    <!-- 角色統計琉璃浮動資訊卡 (Popover / Tooltip) -->
    <div id="char-stats-popover" class="char-stats-popover" role="tooltip" aria-hidden="true"></div>

    <!-- 角色排序微型琉璃選單 (Popover) -->
    <div id="char-sort-popover" class="char-sort-popover" role="menu" aria-hidden="true"></div>

    <!-- 4. 載入核心應用程式邏輯 -->
    <script src="js/app.js"></script>
</body>
</html>
